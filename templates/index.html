<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Giganome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  :root{
    --bg:#0B0B0D;
    --panel:#151519;
    --panel-line:#26262C;
    --text:#F2F1ED;
    --text-dim:#8B8B93;
    --amber:#E8A33D;
    --amber-dim:#4A3A1F;
    --green:#4CD787;
    --red:#E85D4A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  .rig{
    width:100%;
    max-width:420px;
  }

  .nameplate{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-bottom:14px;
    margin-bottom:22px;
    border-bottom:1px solid var(--panel-line);
  }
  .nameplate h1{
    font-size:16px;
    font-weight:600;
    letter-spacing:0.02em;
    margin:0;
  }
  .status-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--text-dim);
    display:inline-block;
    margin-right:7px;
    transition:background .3s;
  }
  .status-dot.synced{ background:var(--green); box-shadow:0 0 6px var(--green); }
  .status-line{ font-size:12px; color:var(--text-dim); display:flex; align-items:center; }

  /* ---------- Home screen ---------- */
  .home-actions{ display:flex; flex-direction:column; gap:14px; }
  .big-btn{
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--text);
    padding:22px 20px;
    border-radius:10px;
    font-size:16px;
    font-weight:500;
    text-align:left;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .big-btn:hover{ border-color:var(--amber); }
  .big-btn small{
    display:block;
    color:var(--text-dim);
    font-weight:400;
    font-size:13px;
    margin-top:4px;
  }
  .join-row{
    display:flex; gap:10px; margin-top:8px;
  }
  .join-row input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--panel-line);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    letter-spacing:0.15em;
    text-align:center;
    text-transform:uppercase;
    padding:12px;
    border-radius:8px;
    width:0;
  }
  .join-row input:focus{ outline:none; border-color:var(--amber); }
  .join-row button{
    background:var(--amber);
    color:#1A1204;
    border:none;
    font-weight:600;
    padding:0 22px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
  }
  .error-text{ color:var(--red); font-size:13px; margin-top:8px; min-height:16px; }

  /* ---------- Session screen ---------- */
  .hidden{ display:none !important; }

  .pulse-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 0 28px;
  }
  .pulse-stage{
    position:relative;
    width:150px;
    height:150px;
  }
  .pulse{
    width:150px; height:150px;
    border-radius:50%;
    border:2px solid var(--panel-line);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    z-index:2;
    background:var(--bg);
    transition:transform .06s ease-out, border-color .06s ease-out, box-shadow .06s ease-out;
  }
  .pulse.beat{
    border-color:var(--amber);
    box-shadow:0 0 30px 4px rgba(232,163,61,0.35);
    transform:scale(1.04);
  }
  .pulse.beat.accent{
    border-color:var(--green);
    box-shadow:0 0 34px 6px rgba(76,215,135,0.4);
  }
  /* Sonar-style ring that expands outward from the pulse circle on every
     beat, then fades and removes itself. Accent beats (beat 1 of the bar)
     get the green ring so the downbeat is visually unmistakable. */
  .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid var(--amber);
    opacity:0.85;
    pointer-events:none;
    z-index:1;
    animation: ringOut 0.55s ease-out forwards;
  }
  .ring.accent{ border-color:var(--green); border-width:2.5px; }
  @keyframes ringOut{
    from{ transform:scale(0.86); opacity:0.85; }
    to{ transform:scale(2.1); opacity:0; }
  }
  /* Row of dots marking position within the bar — the active beat glows,
     the downbeat glows green so you can always see where "beat 1" is. */
  .beat-dots{
    display:flex;
    gap:9px;
    justify-content:center;
    margin-top:18px;
  }
  .beat-dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--panel-line);
    transition:background .08s ease-out, transform .08s ease-out;
  }
  .beat-dot.active{
    background:var(--amber);
    transform:scale(1.6);
  }
  .beat-dot.active.accent{ background:var(--green); }
  /* A small ticker that swings side to side once per beat, like the arm
     of a mechanical metronome — purely decorative but reads instantly as
     "tempo" at a glance from across a stage. */
  .tick-track{
    position:relative;
    width:120px;
    height:10px;
    margin-top:14px;
  }
  .tick-dot{
    position:absolute;
    top:0; left:0;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--amber);
    transition-property:left;
    transition-timing-function:ease-in-out;
  }
  .beat-count{
    font-size:13px;
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    margin-top:10px;
  }
  .bpm-readout{
    font-size:64px;
    font-weight:600;
    font-family:'IBM Plex Mono', monospace;
    line-height:1;
    letter-spacing:-0.02em;
  }
  .bpm-label{
    font-size:12px;
    color:var(--text-dim);
    margin-top:6px;
  }

  .panel-block{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:18px;
    margin-bottom:14px;
  }
  .row{ display:flex; align-items:center; justify-content:space-between; }
  .row + .row{ margin-top:14px; }
  .field-label{ font-size:13px; color:var(--text-dim); }

  .stepper{ display:flex; align-items:center; gap:12px; }
  .stepper button{
    width:34px; height:34px;
    border-radius:8px;
    border:1px solid var(--panel-line);
    background:var(--bg);
    color:var(--text);
    font-size:18px;
    cursor:pointer;
    line-height:1;
  }
  .stepper button:active{ border-color:var(--amber); }
  input[type=range]{
    width:100%;
    accent-color:var(--amber);
    margin-top:12px;
  }

  .sig-options{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .sig-btn{
    border:1px solid var(--panel-line);
    background:var(--bg);
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  .sig-btn.active{ border-color:var(--amber); color:var(--amber); }

  .transport{
    display:flex; gap:10px;
  }
  .transport button{
    flex:1;
    padding:16px;
    border-radius:10px;
    border:none;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-start{ background:var(--amber); color:#1A1204; }
  .btn-stop{ background:var(--panel); color:var(--red); border:1px solid var(--red) !important; }

  .code-display{
    text-align:center;
    padding:16px 0 4px;
  }
  .code-display .code{
    font-family:'IBM Plex Mono', monospace;
    font-size:34px;
    letter-spacing:0.2em;
    font-weight:600;
  }
  .code-display .hint{ font-size:12px; color:var(--text-dim); margin-top:6px; }

  .waiting-text{
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    padding:6px 0 18px;
  }

  .leave-link{
    display:block;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    margin-top:6px;
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    text-decoration:underline;
  }

  .footer{
    margin-top:28px;
    padding-top:16px;
    border-top:1px solid var(--panel-line);
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
  }
  .footer a{
    color:var(--text-dim);
    text-decoration:underline;
  }
  .footer a:hover{ color:var(--amber); }

  @media (prefers-reduced-motion: reduce){
    .pulse{ transition:none; }
  }
</style>
</head>
<body>

<div class="rig">

  <div class="nameplate">
    <h1>Giganome 3.0</h1>
    <div class="status-line"><span class="status-dot" id="statusDot"></span><span id="statusText">offline</span></div>
  </div>

  <!-- ===== HOME SCREEN ===== -->
  <div id="homeScreen">
    <div class="home-actions">
      <button class="big-btn" id="createBtn">
        Start a session
        <small>You control the tempo your bandmates follow.</small>
      </button>

      <div class="big-btn" style="cursor:default;">
        Join a session
        <small>Enter the 4-character code your bandleader shares.</small>
        <div class="join-row">
          <input type="text" id="joinCodeInput" maxlength="4" placeholder="CODE" autocomplete="off">
          <button id="joinBtn">Join</button>
        </div>
        <div class="error-text" id="joinError"></div>
      </div>
    </div>
  </div>

  <!-- ===== SESSION SCREEN ===== -->
  <div id="sessionScreen" class="hidden">

    <div class="code-display" id="codeDisplay">
      <div class="code" id="codeValue">----</div>
      <div class="hint" id="codeHint">Share this code with your bandmates</div>
    </div>

    <div class="pulse-wrap">
      <div class="pulse-stage" id="pulseStage">
        <div class="pulse" id="pulse">
          <div>
            <div class="bpm-readout" id="bpmReadout">120</div>
            <div class="bpm-label">BPM</div>
          </div>
        </div>
      </div>
      <div class="beat-dots" id="beatDots"></div>
      <div class="tick-track"><div class="tick-dot" id="tickDot"></div></div>
      <div class="beat-count" id="beatCount">— / 4</div>
    </div>

    <div id="waitingText" class="waiting-text hidden">Waiting for the host to start…</div>
    <div id="countInText" class="waiting-text hidden mono"></div>

    <!-- Host-only controls -->
    <div id="hostControls" class="hidden">
      <div class="panel-block">
        <div class="row">
          <span class="field-label">Tempo</span>
          <div class="stepper">
            <button id="bpmDown">–</button>
            <span class="mono" id="bpmStepperVal" style="min-width:34px;text-align:center;">120</span>
            <button id="bpmUp">+</button>
          </div>
        </div>
        <input type="range" id="bpmSlider" min="30" max="300" value="120">
      </div>

      <div class="panel-block">
        <div class="field-label">Time signature</div>
        <div class="sig-options" id="sigOptions"></div>
      </div>

      <div class="transport">
        <button class="btn-start" id="startBtn">Start</button>
        <button class="btn-stop hidden" id="stopBtn">Stop</button>
      </div>
    </div>

    <!-- Guest-only info -->
    <div id="guestInfo" class="hidden">
      <div class="panel-block">
        <div class="row">
          <span class="field-label">Members in session</span>
          <span class="mono" id="memberCount">1</span>
        </div>
      </div>
    </div>

    <button class="leave-link" id="leaveBtn">Leave session</button>
  </div>

  <footer class="footer">
    Developed by <a href="https://www.linkedin.com/in/rudranil-goswami-a94298329/" target="_blank" rel="noopener">Rudranil Goswami</a>
  </footer>

</div>

<script>
/* =========================================================
   SYNC METRONOME — client
   =========================================================
   Two independent systems working together:

   1. CLOCK SYNC: we don't trust that "now" on this device equals
      "now" on the server or on anyone else's device. We ping the
      server a handful of times, measure round-trip time, and use
      the lowest-latency sample to estimate `clockOffset`, where
      serverTime ≈ Date.now() + clockOffset.

   2. AUDIO SCHEDULING: once we know a beat should happen at a given
      *server* time, we convert that into a time on this device's
      Web Audio clock (which is far more stable/precise than
      setTimeout/setInterval) and schedule the actual click sound
      ahead of time via a lookahead scheduler. This is the standard
      approach for reliable browser audio timing.
   ========================================================= */

const socket = io();

// ---- DOM refs ----
const homeScreen = document.getElementById('homeScreen');
const sessionScreen = document.getElementById('sessionScreen');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const createBtn = document.getElementById('createBtn');
const joinBtn = document.getElementById('joinBtn');
const joinCodeInput = document.getElementById('joinCodeInput');
const joinError = document.getElementById('joinError');
const codeValue = document.getElementById('codeValue');
const codeDisplay = document.getElementById('codeDisplay');
const pulse = document.getElementById('pulse');
const pulseStage = document.getElementById('pulseStage');
const beatDotsEl = document.getElementById('beatDots');
const tickDot = document.getElementById('tickDot');
const bpmReadout = document.getElementById('bpmReadout');
const beatCountEl = document.getElementById('beatCount');
const waitingText = document.getElementById('waitingText');
const countInText = document.getElementById('countInText');
const hostControls = document.getElementById('hostControls');
const guestInfo = document.getElementById('guestInfo');
const memberCount = document.getElementById('memberCount');
const bpmSlider = document.getElementById('bpmSlider');
const bpmStepperVal = document.getElementById('bpmStepperVal');
const bpmDown = document.getElementById('bpmDown');
const bpmUp = document.getElementById('bpmUp');
const sigOptions = document.getElementById('sigOptions');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const leaveBtn = document.getElementById('leaveBtn');

// ---- App state ----
let isHost = false;
let sessionCode = null;
let bpm = 120;
let beatsPerBar = 4;
let beatUnit = 4;
let isPlaying = false;
let clockOffset = 0; // serverTime ≈ Date.now() + clockOffset (fallback path, via Render)

const SIG_PRESETS = [[2,4],[3,4],[4,4],[5,4],[6,8],[7,8]];

/* =========================================================
   LOCAL WIFI DIRECT (WebRTC)
   -----------------------------------------------------------
   Whenever possible, the host opens a direct browser-to-browser
   connection to each member instead of relaying every tempo tick
   through Render. Nobody has to do anything for this — it just
   negotiates in the background the moment two devices join the
   same session, and it naturally uses the local network path when
   devices share Wi-Fi (that's the whole reason it removes the
   "count or two" of lag). If a direct connection can't be formed
   (different networks, a strict firewall), the app quietly keeps
   using the normal server-relayed path above — nothing breaks.
   ========================================================= */
const START_BUFFER_MS = 1500; // lead time for mid-performance tempo/signature re-anchors
const START_COUNT_IN_MS = 10000; // lead time for the initial Start — long enough to lock the clock offset in tight before the downbeat, per the "10 second count-in" idea
const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
let peerConnections = {};   // sid -> RTCPeerConnection
let dataChannels = {};      // sid -> RTCDataChannel
let hostSid = null;         // members only: the host's socket id
let hostClockOffset = 0;    // members only: hostTime ≈ Date.now() + hostClockOffset
let p2pConnected = false;   // members only: true once synced directly to host

// ============ Clock sync ============
function syncClock(numSamples = 8) {
  return new Promise((resolve) => {
    let best = null;
    let done = 0;

    function sendPing() {
      const t0 = Date.now();
      const handler = (data) => {
        const t1 = Date.now();
        const rtt = t1 - t0;
        const estServerAtT1 = data.server_time + rtt / 2;
        const offset = estServerAtT1 - t1;
        if (!best || rtt < best.rtt) best = { rtt, offset };
        done++;
        socket.off('sync_pong', handler);
        if (done >= numSamples) {
          clockOffset = best.offset;
          updateSyncStatus(best.rtt);
          resolve();
        } else {
          setTimeout(sendPing, 120);
        }
      };
      socket.on('sync_pong', handler);
      socket.emit('sync_ping', { t0 });
    }
    sendPing();
  });
}

function hasActiveLocalPeers() {
  return Object.values(dataChannels).some((dc) => dc.readyState === 'open');
}

function updateSyncStatus(rtt) {
  statusDot.classList.add('synced');
  if (!p2pConnected && !(isHost && hasActiveLocalPeers())) {
    statusText.textContent = `synced · ${Math.round(rtt)}ms`;
  }
}

// periodic light resync so long rehearsals don't drift if the network
// latency profile changes; does not touch clicks already scheduled.
setInterval(() => { if (socket.connected) syncClock(4); }, 25000);

// ============ Local WiFi direct (WebRTC) ============
function updateP2PStatus(rtt) {
  if (isHost) {
    const n = Object.values(dataChannels).filter((dc) => dc.readyState === 'open').length;
    if (n > 0) statusText.textContent = `synced · ${n} on local WiFi`;
    return;
  }
  if (p2pConnected) {
    statusDot.classList.add('synced');
    statusText.textContent = `synced · local WiFi${rtt != null ? ' · ' + Math.round(rtt) + 'ms' : ''}`;
  }
}

function cleanupPeer(sid) {
  const pc = peerConnections[sid];
  if (pc) { try { pc.close(); } catch (e) {} }
  delete peerConnections[sid];
  delete dataChannels[sid];
  if (!isHost && sid === hostSid) {
    p2pConnected = false;
    hostClockOffset = 0;
  }
  updateP2PStatus();
}

function cleanupAllPeers() {
  Object.keys(peerConnections).forEach(cleanupPeer);
}

function setupDataChannel(remoteSid, dc) {
  dataChannels[remoteSid] = dc;
  dc.onopen = () => {
    if (isHost) {
      updateP2PStatus();
    } else {
      startHostClockSync(6);
    }
  };
  dc.onclose = () => cleanupPeer(remoteSid);
  dc.onerror = () => {};
  dc.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    handleDataChannelMessage(remoteSid, msg);
  };
}

function createPeerConnection(remoteSid, isInitiator) {
  const pc = new RTCPeerConnection(RTC_CONFIG);
  peerConnections[remoteSid] = pc;

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      socket.emit('webrtc_signal', { target: remoteSid, kind: 'ice', candidate: e.candidate });
    }
  };
  pc.onconnectionstatechange = () => {
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) {
      cleanupPeer(remoteSid);
    }
  };

  if (isInitiator) {
    setupDataChannel(remoteSid, pc.createDataChannel('giganome'));
  } else {
    pc.ondatachannel = (e) => setupDataChannel(remoteSid, e.channel);
  }
  return pc;
}

function handleDataChannelMessage(remoteSid, msg) {
  if (isHost) {
    if (msg.type === 'ping') {
      const dc = dataChannels[remoteSid];
      if (dc && dc.readyState === 'open') {
        dc.send(JSON.stringify({ type: 'pong', t0: msg.t0, host_time: Date.now() }));
      }
    }
    return;
  }
  if (msg.type === 'pong') {
    handleHostPong(msg);
  } else if (msg.type === 'transport') {
    applyHostTransport(msg);
  }
}

// ---- Member-side: sync directly to the host's clock (no server hop) ----
let hostSyncBest = null;
let hostSyncDone = 0;
let hostSyncTotal = 0;
let hostSyncResolve = null;

function startHostClockSync(numSamples) {
  return new Promise((resolve) => {
    hostSyncBest = null;
    hostSyncDone = 0;
    hostSyncTotal = numSamples;
    hostSyncResolve = resolve;
    sendHostPing();
  });
}

function sendHostPing() {
  const dc = dataChannels[hostSid];
  if (!dc || dc.readyState !== 'open') { if (hostSyncResolve) { hostSyncResolve(); hostSyncResolve = null; } return; }
  dc.send(JSON.stringify({ type: 'ping', t0: Date.now() }));
}

function handleHostPong(msg) {
  const t1 = Date.now();
  const rtt = t1 - msg.t0;
  const estHostAtT1 = msg.host_time + rtt / 2;
  const offset = estHostAtT1 - t1;
  if (!hostSyncBest || rtt < hostSyncBest.rtt) hostSyncBest = { rtt, offset };
  hostSyncDone++;
  if (hostSyncDone >= hostSyncTotal) {
    hostClockOffset = hostSyncBest.offset;
    p2pConnected = true;
    updateP2PStatus(hostSyncBest.rtt);
    if (hostSyncResolve) { hostSyncResolve(); hostSyncResolve = null; }
  } else {
    setTimeout(sendHostPing, 100);
  }
}

setInterval(() => {
  if (!isHost && dataChannels[hostSid] && dataChannels[hostSid].readyState === 'open') {
    startHostClockSync(4);
  }
}, 20000);

// ---- Host-side: apply a transport update sent directly over the wire ----
function applyHostTransport(msg) {
  const wasPlaying = isPlaying;
  bpm = msg.bpm;
  beatsPerBar = msg.beats_per_bar;
  beatUnit = msg.beat_unit;
  isPlaying = msg.playing;
  setLocalBpmDisplay(bpm);
  renderSigOptions();
  refreshTransportUI();
  if (isPlaying && msg.start_time != null) {
    scheduleFromRemote(msg.start_time, 'host', bpm, beatsPerBar);
    if (!wasPlaying) beginCountIn(msg.start_time, 'host'); // only the initial start gets the full count-in treatment
  } else if (!isPlaying) {
    stopScheduler();
    endCountIn();
  }
}

// ---- Host-side: fan a transport update out to every connected member ----
function broadcastTransportToPeers(startTimeHostDomain) {
  const msg = JSON.stringify({
    type: 'transport',
    bpm, beats_per_bar: beatsPerBar, beat_unit: beatUnit,
    playing: isPlaying,
    start_time: startTimeHostDomain,
  });
  Object.values(dataChannels).forEach((dc) => {
    if (dc.readyState === 'open') dc.send(msg);
  });
}

// ---- Signaling (relayed through the server, one-time per peer pair) ----
socket.on('peer_joined', async ({ sid }) => {
  if (!isHost) return;
  const pc = createPeerConnection(sid, true);
  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('webrtc_signal', { target: sid, kind: 'offer', sdp: offer });
  } catch (e) { cleanupPeer(sid); }
});

socket.on('peer_left', ({ sid }) => {
  if (isHost) cleanupPeer(sid);
});

socket.on('webrtc_signal', async (data) => {
  const from = data.from;
  try {
    if (data.kind === 'offer') {
      const pc = createPeerConnection(from, false);
      await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('webrtc_signal', { target: from, kind: 'answer', sdp: answer });
    } else if (data.kind === 'answer') {
      const pc = peerConnections[from];
      if (pc) await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    } else if (data.kind === 'ice' && data.candidate) {
      const pc = peerConnections[from];
      if (pc) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    }
  } catch (e) { /* best-effort; falls back to server relay if this fails */ }
});

// ============ Web Audio scheduling ============
let audioCtx = null;
let audioAnchorEpoch = 0;
let audioAnchorAudioTime = 0;

let schedulerTimer = null;
let nextBeatTime = 0;
let beatCounter = 0;
let secondsPerBeat = 0.5;
let visualQueue = [];
let rafHandle = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioAnchorEpoch = Date.now();
  audioAnchorAudioTime = audioCtx.currentTime;
}

function epochToAudioTime(epochMs) {
  return audioAnchorAudioTime + (epochMs - audioAnchorEpoch) / 1000;
}

function playClick(time, accent) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = accent ? 1600 : 1000;
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(1, time + 0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.06);
}

function startScheduler(serverStartTime, newBpm, newBeatsPerBar) {
  scheduleFromRemote(serverStartTime, 'server', newBpm, newBeatsPerBar);
}

// `domain` says whose clock remoteEpochMs is expressed in — 'self' (no
// translation needed, host scheduling its own transport), 'host' (a
// member synced directly to the host over WebRTC/local WiFi), or
// 'server' (the Render fallback path). We re-resolve the domain to a
// live offset via getActiveOffset() every time we (re)anchor, instead
// of freezing a number at call time, so periodic drift correction below
// can call this same lookup again later with a *freshly measured*
// offset rather than a stale one.
//
// `playAnchor` remembers what we last anchored to, so driftCorrect()
// can keep re-deriving "what nextBeatTime *should* be" for as long as
// playback continues — not just during the pre-roll count-in.
let playAnchor = null;

function scheduleFromRemote(remoteEpochMs, domain, newBpm, newBeatsPerBar) {
  stopScheduler();
  bpm = newBpm;
  beatsPerBar = newBeatsPerBar;
  secondsPerBeat = 60 / bpm;
  renderBeatDots();
  tickDot.style.transitionDuration = secondsPerBeat + 's';
  playAnchor = { remoteEpochMs, domain, bpm, beatsPerBar };

  const startAudioTime = targetAudioStartTime(remoteEpochMs, domain);
  const now = audioCtx.currentTime;

  if (now < startAudioTime) {
    nextBeatTime = startAudioTime;
    beatCounter = 0;
  } else {
    const elapsedBeats = Math.floor((now - startAudioTime) / secondsPerBeat);
    const nextIndex = elapsedBeats + 1;
    nextBeatTime = startAudioTime + nextIndex * secondsPerBeat;
    beatCounter = ((nextIndex % beatsPerBar) + beatsPerBar) % beatsPerBar;
  }

  const scheduleAheadTime = 0.12;
  schedulerTimer = setInterval(() => {
    while (nextBeatTime < audioCtx.currentTime + scheduleAheadTime) {
      const accent = beatCounter === 0;
      playClick(nextBeatTime, accent);
      visualQueue.push({ time: nextBeatTime, accent, beatNum: beatCounter + 1 });
      nextBeatTime += secondsPerBeat;
      beatCounter = (beatCounter + 1) % beatsPerBar;
    }
  }, 25);

  if (!rafHandle) visualLoop();
}

// Converts a target wall-clock instant into this device's own AudioContext
// timeline, compensating for this device's *output* latency (Bluetooth
// speakers/headphones commonly add 100–300ms of their own delay after the
// audio leaves the Web Audio graph — no amount of network clock sync can
// fix that, only knowing about it can). outputLatency isn't available in
// every browser, so this degrades gracefully to 0 where it's missing.
function targetAudioStartTime(remoteEpochMs, domain) {
  const offset = getActiveOffset(domain);
  const localStartEpoch = remoteEpochMs - offset;
  const outputLatency = (audioCtx.outputLatency || audioCtx.baseLatency || 0);
  return epochToAudioTime(localStartEpoch) - outputLatency;
}

// ---- Continuous drift correction (runs for the whole performance, not
// just the count-in) ----
// The count-in only tightens the *offset* estimate right up to the
// downbeat; it says nothing about what happens for the next several
// minutes of playing. Two things drift after that: the network offset
// itself (routes/latency shift), and — more importantly for a live set —
// the AudioContext's own hardware clock, which is not perfectly locked to
// the system clock (Date.now()) and can run a few hundred ppm fast or
// slow depending on the device. Left uncorrected, that alone is enough to
// pull two phones audibly apart over the course of a song.
//
// Every few seconds we recompute where the beat grid *should* be from the
// original anchor plus the latest offset, and nudge nextBeatTime toward
// it by a tiny, capped amount — small enough to never be heard as a
// glitch, applied often enough that drift never has room to build up.
const DRIFT_CHECK_MS = 6000;
const MAX_DRIFT_NUDGE_SEC = 0.003; // 3ms per check — inaudible, ~0.5ms/sec max correction rate

function driftCorrect() {
  if (!isPlaying || !playAnchor || !schedulerTimer) return;
  const idealStart = targetAudioStartTime(playAnchor.remoteEpochMs, playAnchor.domain);
  const beatsSoFar = Math.round((nextBeatTime - idealStart) / secondsPerBeat);
  const idealNextBeatTime = idealStart + beatsSoFar * secondsPerBeat;
  const drift = idealNextBeatTime - nextBeatTime;
  const nudge = Math.max(-MAX_DRIFT_NUDGE_SEC, Math.min(MAX_DRIFT_NUDGE_SEC, drift));
  nextBeatTime += nudge;
}
setInterval(driftCorrect, DRIFT_CHECK_MS);

function stopScheduler() {
  if (schedulerTimer) clearInterval(schedulerTimer);
  schedulerTimer = null;
  playAnchor = null;
  visualQueue = [];
  pulse.classList.remove('beat', 'accent');
  beatCountEl.textContent = `— / ${beatsPerBar}`;
  Array.from(beatDotsEl.children).forEach((d) => d.classList.remove('active', 'accent'));
  pulseStage.querySelectorAll('.ring').forEach((r) => r.remove());
  tickDot.style.transitionDuration = '0s';
  tickDot.style.left = '0px';
  tickSide = false;
}

function visualLoop() {
  if (visualQueue.length && audioCtx.currentTime >= visualQueue[0].time) {
    const b = visualQueue.shift();
    flashPulse(b.accent, b.beatNum);
  }
  rafHandle = requestAnimationFrame(visualLoop);
}

function renderBeatDots() {
  beatDotsEl.innerHTML = '';
  for (let i = 0; i < beatsPerBar; i++) {
    const d = document.createElement('div');
    d.className = 'beat-dot';
    beatDotsEl.appendChild(d);
  }
}

function spawnRing(accent) {
  const ring = document.createElement('div');
  ring.className = 'ring' + (accent ? ' accent' : '');
  pulseStage.appendChild(ring);
  ring.addEventListener('animationend', () => ring.remove());
}

let tickSide = false;
function swingTick() {
  tickSide = !tickSide;
  tickDot.style.left = tickSide ? 'calc(100% - 10px)' : '0px';
}

let flashTimeout = null;
function flashPulse(accent, beatNum) {
  pulse.classList.add('beat');
  pulse.classList.toggle('accent', accent);
  beatCountEl.textContent = `${beatNum} / ${beatsPerBar}`;
  spawnRing(accent);
  swingTick();

  const dots = beatDotsEl.children;
  for (let i = 0; i < dots.length; i++) {
    const isCurrent = i === beatNum - 1;
    dots[i].classList.toggle('active', isCurrent);
    dots[i].classList.toggle('accent', isCurrent && accent);
  }

  clearTimeout(flashTimeout);
  flashTimeout = setTimeout(() => pulse.classList.remove('beat', 'accent'), 90);
}

// ============ Time signature buttons ============
function renderSigOptions() {
  sigOptions.innerHTML = '';
  SIG_PRESETS.forEach(([num, unit]) => {
    const b = document.createElement('button');
    b.className = 'sig-btn' + (num === beatsPerBar && unit === beatUnit ? ' active' : '');
    b.textContent = `${num}/${unit}`;
    b.onclick = () => {
      beatsPerBar = num;
      beatUnit = unit;
      renderSigOptions();
      let hostStart = null;
      if (isPlaying) {
        hostStart = Date.now() + START_BUFFER_MS;
        scheduleFromRemote(hostStart, 'self', bpm, beatsPerBar);
      }
      broadcastTransportToPeers(hostStart);
      socket.emit('set_time_signature', { beats_per_bar: num, beat_unit: unit });
    };
    sigOptions.appendChild(b);
  });
}

// ============ UI helpers ============
function showSessionScreen() {
  homeScreen.classList.add('hidden');
  sessionScreen.classList.remove('hidden');
  codeValue.textContent = sessionCode;
  bpmReadout.textContent = bpm;
  bpmSlider.value = bpm;
  bpmStepperVal.textContent = bpm;
  renderSigOptions();
  renderBeatDots();

  if (isHost) {
    hostControls.classList.remove('hidden');
    guestInfo.classList.add('hidden');
  } else {
    hostControls.classList.add('hidden');
    guestInfo.classList.remove('hidden');
  }
  refreshTransportUI();
}

function refreshTransportUI() {
  if (isPlaying) {
    startBtn.classList.add('hidden');
    stopBtn.classList.remove('hidden');
    waitingText.classList.add('hidden');
  } else {
    startBtn.classList.remove('hidden');
    stopBtn.classList.add('hidden');
    if (!isHost) waitingText.classList.remove('hidden');
    stopScheduler();
  }
}

// ============ Count-in ============
/* The 10-second lead time on Start isn't just a safety margin — every
   device uses it to keep re-running clock sync (against the host
   directly if on local WiFi, against the server otherwise) right up
   until just before the downbeat, so the offset it schedules from is
   the freshest, tightest estimate possible rather than one taken up to
   25s ago. Nothing audible happens until the count-in reaches zero, so
   re-scheduling mid-countdown is silent and safe. */
let countInTimer = null;
let countInLocalStart = null;

function getActiveOffset(domain) {
  if (domain === 'self') return 0;
  if (domain === 'host') return hostClockOffset;
  return clockOffset;
}

function beginCountIn(remoteEpochMs, domain) {
  endCountIn();
  countInLocalStart = remoteEpochMs - getActiveOffset(domain);
  countInText.classList.remove('hidden');
  updateCountInText();
  countInTimer = setInterval(updateCountInText, 100);
  if (domain !== 'self') refineDuringCountIn(remoteEpochMs, domain);
}

function updateCountInText() {
  if (countInLocalStart == null) return;
  const remaining = (countInLocalStart - Date.now()) / 1000;
  if (remaining <= 0) {
    endCountIn();
    return;
  }
  countInText.textContent = `Starting in ${remaining.toFixed(1)}s…`;
}

function endCountIn() {
  if (countInTimer) clearInterval(countInTimer);
  countInTimer = null;
  countInLocalStart = null;
  countInText.classList.add('hidden');
}

function refineDuringCountIn(remoteEpochMs, domain) {
  const localStart = remoteEpochMs - getActiveOffset(domain);
  const msUntilStart = localStart - Date.now();
  // Stop refining with margin to spare so the very last resync can't
  // land a reschedule right on top of the downbeat itself.
  if (msUntilStart < 900 || !isPlaying) return;

  const resync = domain === 'host' ? startHostClockSync(4) : syncClock(4);
  resync.then(() => {
    if (!isPlaying) return;
    countInLocalStart = remoteEpochMs - getActiveOffset(domain);
    scheduleFromRemote(remoteEpochMs, domain, bpm, beatsPerBar);
    refineDuringCountIn(remoteEpochMs, domain);
  });
}

// ============ Actions ============
createBtn.onclick = async () => {
  initAudio();
  await syncClock();
  socket.emit('create_session', { bpm: 120 });
};

joinBtn.onclick = async () => {
  const code = joinCodeInput.value.trim().toUpperCase();
  if (code.length !== 4) {
    joinError.textContent = 'Enter the 4-character code.';
    return;
  }
  joinError.textContent = '';
  initAudio();
  await syncClock();
  socket.emit('join_session', { code });
};
joinCodeInput.addEventListener('input', () => {
  joinCodeInput.value = joinCodeInput.value.toUpperCase();
});

leaveBtn.onclick = () => location.reload();

let lastTempoEmit = 0;
function setLocalBpmDisplay(v) {
  bpmReadout.textContent = v;
  bpmStepperVal.textContent = v;
  bpmSlider.value = v;
}
// Re-anchors on the host's own clock (if playing) and fans that out to
// any directly-connected peers, then also tells the server (for the
// legacy/fallback path, and so late joiners get correct state).
function applyTempoChange(v) {
  bpm = v;
  let hostStart = null;
  if (isPlaying) {
    hostStart = Date.now() + START_BUFFER_MS;
    scheduleFromRemote(hostStart, 'self', bpm, beatsPerBar);
  }
  broadcastTransportToPeers(hostStart);
  socket.emit('set_tempo', { bpm: v });
}
function emitTempo(v) {
  const t = Date.now();
  if (t - lastTempoEmit < 90) return;
  lastTempoEmit = t;
  applyTempoChange(v);
}
bpmSlider.addEventListener('input', () => {
  const v = parseInt(bpmSlider.value, 10);
  setLocalBpmDisplay(v);
  emitTempo(v);
});
bpmDown.onclick = () => {
  const v = Math.max(30, parseInt(bpmSlider.value, 10) - 1);
  setLocalBpmDisplay(v);
  applyTempoChange(v);
};
bpmUp.onclick = () => {
  const v = Math.min(300, parseInt(bpmSlider.value, 10) + 1);
  setLocalBpmDisplay(v);
  applyTempoChange(v);
};

startBtn.onclick = () => {
  const hostStart = Date.now() + START_COUNT_IN_MS;
  isPlaying = true;
  refreshTransportUI();
  scheduleFromRemote(hostStart, 'self', bpm, beatsPerBar); // host's own clock — exact, no network wait
  beginCountIn(hostStart, 'self');
  broadcastTransportToPeers(hostStart);
  socket.emit('start', {}); // fallback path for anyone not on a direct connection
};
stopBtn.onclick = () => {
  isPlaying = false;
  refreshTransportUI();
  endCountIn();
  broadcastTransportToPeers(null);
  socket.emit('stop', {});
};

// ============ Socket events ============
socket.on('session_created', (data) => {
  isHost = true;
  sessionCode = data.code;
  bpm = data.bpm;
  beatsPerBar = data.beats_per_bar;
  beatUnit = data.beat_unit;
  isPlaying = data.playing;
  showSessionScreen();
});

socket.on('session_joined', (data) => {
  isHost = false;
  sessionCode = data.code;
  hostSid = data.host_sid;
  bpm = data.bpm;
  beatsPerBar = data.beats_per_bar;
  beatUnit = data.beat_unit;
  isPlaying = data.playing;
  memberCount.textContent = data.member_count;
  showSessionScreen();
  if (isPlaying && data.start_time) {
    startScheduler(data.start_time, bpm, beatsPerBar);
  }
});

socket.on('join_error', (data) => {
  joinError.textContent = data.message;
});

socket.on('member_update', (data) => {
  memberCount.textContent = data.member_count;
});

// The host applies its own transport changes locally the instant it acts
// (see startBtn/stopBtn/applyTempoChange above) and pushes them straight
// to connected peers over WebRTC. These server echoes exist for the
// fallback path — a peer that isn't directly connected yet, or a late
// joiner — so the host ignores its own echo, and a peer already synced
// directly to the host ignores the (higher-latency) server copy too.
socket.on('tempo_updated', (data) => {
  if (isHost || p2pConnected) return;
  bpm = data.bpm;
  isPlaying = data.playing;
  setLocalBpmDisplay(bpm);
  if (isPlaying && data.start_time) {
    startScheduler(data.start_time, bpm, beatsPerBar);
  }
  refreshTransportUI();
});

socket.on('time_signature_updated', (data) => {
  if (isHost || p2pConnected) return;
  beatsPerBar = data.beats_per_bar;
  beatUnit = data.beat_unit;
  isPlaying = data.playing;
  renderSigOptions();
  if (isPlaying && data.start_time) {
    startScheduler(data.start_time, bpm, beatsPerBar);
  }
  refreshTransportUI();
});

socket.on('playback_started', (data) => {
  if (isHost || p2pConnected) return;
  isPlaying = true;
  bpm = data.bpm;
  beatsPerBar = data.beats_per_bar;
  beatUnit = data.beat_unit;
  setLocalBpmDisplay(bpm);
  refreshTransportUI();
  startScheduler(data.start_time, bpm, beatsPerBar);
  beginCountIn(data.start_time, 'server');
});

socket.on('playback_stopped', () => {
  if (isHost || p2pConnected) return;
  isPlaying = false;
  refreshTransportUI();
  endCountIn();
});

socket.on('session_ended', (data) => {
  cleanupAllPeers();
  endCountIn();
  alert(data.reason || 'Session ended.');
  location.reload();
});

socket.on('disconnect', () => {
  cleanupAllPeers();
  endCountIn();
  statusDot.classList.remove('synced');
  statusText.textContent = 'offline';
});
</script>
